backend:
  name: github
  repo: ajcfguinee-dev/ajcf-guinee
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:

  - name: "projects"
    label: "📁 Projets AJCF"
    folder: "projects"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre du projet", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Description complète", name: "body", widget: "markdown" }

  - name: "team"
    label: "👥 Équipe AJCF"
    folder: "team"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Nom", name: "name", widget: "string" }
      - { label: "Fonction", name: "role", widget: "string" }
      - { label: "Photo", name: "photo", widget: "image" }
      - { label: "Biographie", name: "body", widget: "markdown" }

  - name: "posts"
    label: "📰 Actualités"
    folder: "posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Contenu", name: "body", widget: "markdown" }
